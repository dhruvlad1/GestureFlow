[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "gestureflow"
version = "0.1.0"
description = "Touchless computer interaction using hand gestures."
requires-python = ">=3.11,<3.14"

dependencies = [
    "PySide6",
    "opencv-python",
    "mediapipe",
    "pyautogui",
    "numpy",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]

